<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan Neon Acoustic Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#e0faff"/>
    </linearGradient>

    <!-- Globe Ring & Orbit Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Amber Gold Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Deep Contrast Glow/Drop Shadow to ensure readability on both white and black backgrounds -->
    <filter id="universalContrastShadow" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Semi-dark halo to ensure high contrast against pure white backgrounds -->
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#030712" flood-opacity="0.45"/>
    </filter>

    <!-- Vibrant Bloom Effect -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background (No Squircle Box / Background Card) -->
  
  <g filter="url(#universalContrastShadow)">
    <!-- 1. Globe Frame: Longitude & Latitude Lines (The "World" Dimension) -->
    <g fill="none" stroke-linecap="round">
      <!-- Outer Globe Border with crisp contrast stroke -->
      <circle cx="256" cy="256" r="190" stroke="url(#globeGrad)" stroke-width="8" stroke-opacity="0.95"/>
      <circle cx="256" cy="256" r="190" stroke="#0f172a" stroke-width="1.5" stroke-opacity="0.3"/>

      <!-- Parallels / Latitudes -->
      <ellipse cx="256" cy="256" rx="190" ry="78" stroke="url(#globeGrad)" stroke-width="4.5" stroke-opacity="0.6" stroke-dasharray="12 8"/>
      <ellipse cx="256" cy="256" rx="190" ry="142" stroke="url(#globeGrad)" stroke-width="4" stroke-opacity="0.45"/>

      <!-- Equator Line -->
      <line x1="66" y1="256" x2="446" y2="256" stroke="url(#globeGrad)" stroke-width="4" stroke-opacity="0.5"/>

      <!-- Central Meridians / Longitudes -->
      <ellipse cx="256" cy="256" rx="104" ry="190" stroke="url(#globeGrad)" stroke-width="5" stroke-opacity="0.6"/>
      <ellipse cx="256" cy="256" rx="42" ry="190" stroke="url(#globeGrad)" stroke-width="4" stroke-opacity="0.4"/>
      <line x1="256" y1="66" x2="256" y2="446" stroke="url(#globeGrad)" stroke-width="4" stroke-opacity="0.5"/>
    </g>

    <!-- 2. Dynamic Tuner Orbital Ring (28° Angle) -->
    <g transform="rotate(-28 256 256)">
      <ellipse cx="256" cy="256" rx="228" ry="84" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" stroke-opacity="0.85"/>
      
      <!-- Cyan Satellite Signal Beacon -->
      <circle cx="484" cy="256" r="10" fill="#00f2fe" filter="url(#cyanGlow)"/>
      <circle cx="484" cy="256" r="5" fill="#ffffff"/>

      <!-- Amber Master Tier Radio Beacon -->
      <circle cx="28" cy="256" r="8" fill="url(#amberGrad)"/>
      <circle cx="28" cy="256" r="4" fill="#ffffff"/>
    </g>

    <!-- 3. Central Acoustic Equalizer Pillars (The "Tuner" Soundwave Core) -->
    <!-- Soundwaves have both strong cyan neon fills and precise inner core highlights for universal pop -->
    <g filter="url(#cyanGlow)">
      <!-- Far Left Sub Bar -->
      <rect x="136" y="224" width="18" height="64" rx="9" fill="url(#cyanGrad)"/>
      
      <!-- Mid-Left 2 -->
      <rect x="176" y="180" width="20" height="152" rx="10" fill="url(#cyanGrad)"/>
      
      <!-- Mid-Left 1 -->
      <rect x="216" y="132" width="22" height="248" rx="11" fill="url(#cyanGrad)"/>
      <!-- Inner White Apex Highlight -->
      <rect x="224" y="146" width="6" height="96" rx="3" fill="#ffffff" fill-opacity="0.9"/>

      <!-- Center Pillar (Primary Frequency Apex) -->
      <rect x="256" y="86" width="24" height="340" rx="12" fill="url(#cyanGrad)"/>
      <!-- Crisp White Core on Center Pillar -->
      <rect x="264" y="102" width="8" height="150" rx="4" fill="#ffffff" fill-opacity="0.95"/>

      <!-- Mid-Right 1 -->
      <rect x="298" y="150" width="22" height="212" rx="11" fill="url(#cyanGrad)"/>
      <rect x="306" y="164" width="6" height="70" rx="3" fill="#ffffff" fill-opacity="0.85"/>

      <!-- Mid-Right 2 -->
      <rect x="338" y="196" width="20" height="120" rx="10" fill="url(#cyanGrad)"/>

      <!-- Far Right Harmonic Bar -->
      <rect x="376" y="232" width="18" height="48" rx="9" fill="url(#cyanGrad)"/>
    </g>

    <!-- Precise Tuner Calibration Center Dot -->
    <circle cx="268" cy="256" r="4.5" fill="#ffffff"/>
    <circle cx="268" cy="256" r="8" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8"/>
  </g>
</svg>