name: worldtuner_mobile
description: WorldTuner Android and iOS radio client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/stations.json
