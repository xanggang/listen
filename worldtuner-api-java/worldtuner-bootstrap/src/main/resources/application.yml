server:
  port: 8787
  compression:
    enabled: false
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: worldtuner-api-java
  threads:
    virtual:
      enabled: true

worldtuner:
  # 目录库：v2 业务库，公开 API 只读；管理端少量写操作。
  catalog-db-path: ../worldTuner-data/v2/data/worldtuner-v2.sqlite
  # 统计库：独立 SQLite 文件，启用 WAL。
  metrics-db-path: .local/metrics.sqlite
  map-snapshot-ttl-seconds: 300
  allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"
  cache-enabled: true
  admin-token: "change-me"
  read-limit-per-minute: 180
  search-limit-per-minute: 30
  metrics-limit-per-minute: 60

logging:
  level:
    root: INFO
